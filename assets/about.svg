<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img">
<defs>
  <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c4b5fd"/>
  </linearGradient>
  <radialGradient id="bg" cx="50%" cy="0%" r="95%">
    <stop offset="0" stop-color="#17132a"/><stop offset="1" stop-color="#07070c"/>
  </radialGradient>
  <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .2 } }
  @keyframes breathe { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
  .pulse { animation: pulse 1.6s ease-in-out infinite }
  .breathe { animation: breathe 3.2s ease-in-out infinite }
</style>
<rect width="900" height="380" rx="10" fill="#07070c"/>
<rect x="16" y="16" width="868" height="348" rx="12" fill="url(#bg)"/>
<rect class="breathe" x="16" y="16" width="868" height="348" rx="12" fill="none" stroke="url(#stroke)" stroke-width="3" filter="url(#glow)"/>
<rect x="16" y="16" width="868" height="348" rx="12" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>
<g fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M6,36 V6 H36"/>
  <path d="M864,6 H894 V36"/>
  <path d="M6,344 V374 H36"/>
  <path d="M894,344 V374 H864"/>
</g>
<text x="450" y="84" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="9" fill="url(#title)" filter="url(#glow)">ABOUT ME</text>
<line x1="400" y1="102" x2="500" y2="102" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="1.5"/>
<text x="450" y="138" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#cfcfe0">Programmer dari Indonesia yang suka ngoprek dan bikin tools sendiri.</text>
<text x="450" y="164" text-anchor="middle" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="16" fill="#cfcfe0">Belajar lewat proyek nyata, terbuka buat kolaborasi dan diskusi.</text>
<line x1="382" y1="198" x2="382" y2="342" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5"/>
<text x="360" y="214" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#22d3ee">NAMA</text>
<text x="402" y="214" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#e9e9f5">BKEY</text>
<text x="360" y="244" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#22d3ee">BASE</text>
<text x="402" y="244" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="14" fill="#e9e9f5">Indonesia</text>
